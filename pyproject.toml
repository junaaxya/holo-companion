[project]
name = "holo-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.16.1",
    "silero-vad==6.2.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=1.12.0",
    "torchaudio>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/holo_companion"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
